name: nightly-timeout

on:
  schedule:
    - cron: '15 18 * * *'   # 18:15 UTC = 23:45 IST
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel nightly runs still awaiting approval
        id: cancel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=waiting" \
                  --jq '.workflow_runs[].id')
          if [ -z "$ids" ]; then
            echo "nothing pending"
            echo "cancelled_ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for id in $ids; do
            echo "cancelling run $id (never approved)"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
          done
          {
            echo "cancelled_ids<<EOF"
            echo "$ids"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify skipped night
        if: steps.cancel.outputs.cancelled_ids != ''
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          while read -r id; do
            [ -z "$id" ] && continue
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Night skipped: nightly run was never approved. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$id" \
              >/dev/null
          done <<< "${{ steps.cancel.outputs.cancelled_ids }}"
