name: nightly

# Triggered by pg_cron on Supabase at 16:15 UTC (21:45 IST), which POSTs to
# this workflow's dispatch endpoint. GitHub's own `schedule:` trigger was
# removed: its global queue delayed this run by 2-4 hours on consecutive
# nights. Do not add `schedule:` back.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 5
    steps:
      - run: echo "Approved at $(date -u) UTC"

  # Runs in parallel with `gate`. If the approval never comes, cancel the whole
  # run so it does not sit waiting forever. This used to be a separate workflow
  # on its own cron; the two crons drifted independently and the guard killed a
  # legitimate run, so it now measures from THIS run's own start.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: write
    steps:
      - name: Cancel run if the gate is never approved
        env:
          GH_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 120*60 ))
          seen_pending=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            pending=$(gh api               "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/pending_deployments"               --jq 'length' 2>/dev/null || echo 0)

            if [ "$pending" -gt 0 ]; then
              seen_pending=1
            elif [ "$seen_pending" -eq 1 ]; then
              echo "gate approved, guard standing down"
              exit 0
            fi
            sleep 60
          done

          if [ "$seen_pending" -eq 0 ]; then
            echo "gate never requested approval; nothing to guard"
            exit 0
          fi

          echo "gate not approved within 120 minutes, cancelling run"
          curl -sS -X POST             "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             -d text="Night skipped: nightly run was never approved. See: ${RUN_URL}"             >/dev/null || true
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  run:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Preflight - is the model host actually up?
        run: |
          set -euo pipefail
          if ! curl -sSf -m 30 http://llm-host:1234/v1/models -o /tmp/models.json; then
            echo "::error::llm-host unreachable. Machine asleep, LM Studio down, or VPN on."
            exit 1
          fi
          for m in qwen-extract bge-small; do
            grep -q "\"$m\"" /tmp/models.json || { echo "::error::model $m not loaded"; exit 1; }
          done
          echo "preflight OK"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        shell: bash
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_BASE_URL:         http://llm-host:1234/v1
          LLM_MODEL:            qwen-extract
          EMBED_MODEL:          bge-small
        run: python -m painminer.tools.run_pipeline 2>&1 | tee /tmp/pipeline-output.log

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest
          path: digests/
          if-no-files-found: warn

      - name: Publish pipeline report to job summary
        if: always()
        run: |
          if [ -f /tmp/pipeline-output.log ]; then
            awk '/PIPELINE REPORT/{found=1} found' /tmp/pipeline-output.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Nightly run FAILED. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null
