name: deps-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import every module in painminer/
        env:
          SUPABASE_URL:         http://localhost
          SUPABASE_SERVICE_KEY: dummy
          TELEGRAM_TOKEN:       dummy
          TELEGRAM_CHAT_ID:     dummy
          LLM_BASE_URL:         http://localhost:1234/v1
          LLM_MODEL:            dummy
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          failures = []
          for f in sorted(pathlib.Path("painminer").rglob("*.py")):
              if "__pycache__" in f.parts:
                  continue
              mod = ".".join(f.with_suffix("").parts)
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  failures.append((mod, repr(e)))

          if failures:
              for mod, err in failures:
                  print(f"FAIL {mod}: {err}")
              sys.exit(1)
          print("all modules import cleanly")
          PY
